[package]
name = "desktop"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
timebreak-core = { path = "../../../crates/core" }
timebreak-ballistics = { path = "../../../crates/ballistics" }
timebreak-analytics = { path = "../../../crates/analytics" }
timebreak-storage = { path = "../../../crates/storage" }
timebreak-platform = { path = "../../../crates/platform" }

tauri = { workspace = true, features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-shell = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
rand_chacha = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
